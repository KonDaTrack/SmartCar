    old_z_minmax_m: [-14.294, 14.562]
    new_z_minmax_m: [-12.893, 2.919]
    conclusion: >
      The new extrinsic roughly halves the IMU velocity-prediction ratio
      (0.26 -> 0.21) and improves loop error by about 10%, but GLIM still
      reports "IMU prediction is not good". The remaining warning is likely
      dominated by time offset / IMU bias / motion model, not only the
      orientation. Do not treat this run as a full validation.
  note: >
    The difference is essentially a yaw of about 88 degrees. The old LIO
    used the C16 point cloud as if +x were forward; the board data shows the
    raw cloud's forward direction is approximately +y. The old GLIM log
    repeatedly reports "Possibly T_lidar_imu is not accurate" and poor IMU
    prediction, so the old value is not a clean reference.


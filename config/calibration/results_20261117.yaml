# Calibration results, 2026-11-17 (corrected transform direction).
#
# Convention: T_a_b maps a point from frame b to frame a:
#   p_a = T_a_b * p_b
# Frames:
#   cam  = D435i infra1 optical frame (z forward, x right, y down)
#   lidar = C16 point-cloud frame (`rslidar`)
#   imu  = VX1000 raw IMU frame (`imu_link`, NED: x forward, y right, z down)
#
# Chain (standard T_a_b notation):
#   T_imu_cam = T_imu_lidar * T_lidar_cam
#   T_imu_lidar = T_imu_cam * T_cam_lidar
#
# Source bags:
#   cam_lidar: /home/yunle/bags/calib_cam_lidar_20261117_v03
#   dynamic:   /home/yunle/bags/calib_all_sensors_20261117_v01
#
# Camera intrinsics: D435i factory infra1, K from camera_info, D=0.
# Target: checkerboard 10x7 squares, 0.10 m squares (9x6 inner corners).
#
# t_a_b is the origin of frame b expressed in frame a.

gravity_ground_roll_pitch_check:
  # Static window from the 2026-11-17 all-sensor bag: t=1794906567.532,
  # gyro norm mean 0.0020 rad/s. LiDAR ground plane vs IMU specific force.
  static_window_t: 1794906567.532
  gyro_norm_mean_rad_s: 0.0020
  ground_plane_normal_lidar: [0.0135, 0.0156, 0.9998]
  imu_specific_force_unit: [0.0060, 0.0200, -0.9998]
  angle_current_T_imu_lidar_deg: 3.429
  angle_old_static_roll_pi_deg: 2.085
  correction_axis: [0.3869, -0.92198, -0.01612]
  correction_angle_deg: 3.429
  corrected_T_imu_lidar:
    - [0.030984440, 0.999469720, -0.010012050, 1.153771680]
    - [0.999497560, -0.030915280, 0.006990360, 0.049744820]
    - [0.006677120, -0.010223610, -0.999925440, -1.263433380]
    - [0.000000000, 0.000000000, 0.000000000, 1.000000000]
  note: >
    The static ground-plane/gravity check constrains only roll and pitch,
    not yaw. The current derived roll/pitch is 3.43 deg away from the
    ground/gravity alignment; the old static roll=pi value is 2.09 deg away.
    The corrected matrix applies the minimal roll/pitch correction while
    keeping the current yaw and translation. It is an optional refinement,
    not a replacement for a 6-DoF calibration, and depends on the ground
    patch being locally planar and the IMU being at rest.

methods:
  camera_lidar: >
    Checkerboard: solvePnP camera plane + background-differenced LiDAR board
    points; robust point-to-plane least squares over 13 inlier poses.
  lidar_imu: >
    LI-Init received data but could not accumulate 3-axis rotational
    excitation because the vehicle only yaws (roll/pitch excitation = 0).
    T_imu_lidar is derived from the measured camera-IMU mounting and the
    calibrated camera-LiDAR transform: T_imu_lidar = T_imu_cam * T_cam_lidar.
  camera_imu_td: >
    VINS-Fusion mono+IMU with fixed body_T_cam0 = T_imu_cam, estimate_td=1.
  lidar_imu_td: >
    tools/estimate_lidar_imu_offset.py; raw peak -40 ms, detrended/derivative
    peak -30 ms. Use -30 ms; uncertainty about +/-10 ms.

caveats:
  - LiDAR-IMU full 6-DoF extrinsic was not optimized by LI-Init; it is derived.
  - td_lidar_imu is a correlation estimate, not a full batch optimization.
  - The old LIO log itself flagged T_lidar_imu as inaccurate; do not treat the
    old value as ground truth. Validate the new value with a fresh LIO run.

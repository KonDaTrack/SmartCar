# Soft-sync calibration for LIO (C16 + VX1000 IMU + chassis odometry).
#
# These are starting values, not a substitute for hardware time sync.
# Fill them from a motion calibration bag:
#   python3 tools/estimate_offsets.py /bags/<bag> --wheel-base 1.2
#
# wheel_to_imu_offset_ms:
#   Positive = add this many ms to wheel/vehicle_status timestamps so they
#   line up with the IMU (convention used by tools/estimate_offsets.py).
#
# lidar_to_imu_offset_ms:
#   Candidate for the LIO front-end's time_offset_lidar_to_imu. The sign
#   convention depends on the LIO implementation; verify with a straight
#   line and a rotation before committing.
#
# After changing these, record the bag name, date and LIO version in the
# release manifest.
updated: "2026-10-30"
source_bag: "20261030_065908"
wheel_base: 1.2
# Acceleration events (speed derivative vs IMU acc_x, corr 0.774):
# wheel timestamps are 65 ms later, so apply -65 ms to align with the IMU.
# The raw yaw cross-correlation was broad (+460..+710 ms) because the
# steering command is smooth; do not use it as the timestamp offset.
wheel_to_imu_offset_ms: -65.0
# Pending: requires a LiDAR-inertial calibration/front-end; this bag alone
# cannot separate LiDAR-IMU time offset from extrinsic error.
lidar_to_imu_offset_ms: 0.0
notes: >
  Software sync only; no PPS/PTP. Static extrinsics from autox_yuhuo_1.launch
  with a 180 deg roll on imu_link (VX1000 z-down). Steer scale 0.914 is
  provisional (integrated yaw ratio); validate with a sharper run.

# SmartCar site config for the LSLIDAR C16 (CX series ROS 2 driver).
# The node runs in namespace /cx with name /cx/lslidar_driver_node.
/cx/lslidar_driver_node:
  ros__parameters:
    packet_rate: 1695.0
    device_ip: 192.168.100.201   # LSLIDAR C16 on the vehicle LAN
    msop_port: 2368
    difop_port: 2369
    pcl_type: false
    add_multicast: false
    group_ip: 224.1.1.2
    use_time_service: false
    min_range: 0.15
    max_range: 200.0
    angle_disable_min: 0
    angle_disable_max: 0
    distance_unit: 0.4
    horizontal_angle_resolution: 0.18
    frame_id: rslidar            # matches base2laser TF
    topic_name: lslidar_point_cloud
    publish_scan: false
    scan_num: 8
    coordinate_opt: false

# rosbag2 subscription QoS overrides for high-rate VX1000 topics.
#
# Started as a test after an all-sensor recording dropped /VX1000_ins and
# /VX1000_odom to 60-70 Hz while /VX1000_imu stayed at 100 Hz. A 60 s
# all-sensor test with this file plus --max-cache-size 128 MiB kept all
# three at 100 Hz. The publisher offers depth 100; the recorder needs a
# larger subscription queue while camera images are being written.
/VX1000_imu:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 1000
/VX1000_ins:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 1000
/VX1000_odom:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 1000
/VX1000_gnss:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 1000
/VX1000_stat:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 1000
/VX1000_cov:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 1000
/imu/data:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 1000
/gnss/fix:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 1000

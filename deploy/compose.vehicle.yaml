name: smartcar-vehicle

x-common-env: &common-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  SMARTCAR_CONFIG_DIR: /config
  SMARTCAR_HOST_IP: ${VEHICLE_IP:-192.168.100.10}
  SMARTCAR_START_INS: ${SMARTCAR_START_INS:-1}
  SMARTCAR_START_CHASSIS: ${SMARTCAR_START_CHASSIS:-1}
  SMARTCAR_VX1000_PORT: /dev/ttyUSB0

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sensors:
    image: ${IMAGE:-smartcar-ros2}:${IMAGE_TAG:-dev}
    network_mode: host
    ipc: host
    environment: *common-env
    devices:
      - ${VX1000_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    group_add:
      - dialout
    volumes:
      - ${SMARTCAR_CONFIG_HOST_DIR:-../config}:/config:ro
    command: ros2 launch smartcar_bringup sensors.launch.py
    restart: unless-stopped
    logging: *default-logging

  slam:
    image: ${IMAGE:-smartcar-ros2}:${IMAGE_TAG:-dev}
    network_mode: host
    ipc: host
    environment: *common-env
    volumes:
      - ${SMARTCAR_CONFIG_HOST_DIR:-../config}:/config:ro
    command: ros2 launch smartcar_bringup slam.launch.py
    restart: unless-stopped
    logging: *default-logging
    # cpuset: "2-3"

  chassis:
    image: ${IMAGE:-smartcar-ros2}:${IMAGE_TAG:-dev}
    network_mode: host
    ipc: host
    environment: *common-env
    volumes:
      - ${SMARTCAR_CONFIG_HOST_DIR:-../config}:/config:ro
    command: ros2 launch smartcar_bringup chassis.launch.py
    restart: unless-stopped
    profiles: [chassis]
    logging: *default-logging

  record:
    image: ${IMAGE:-smartcar-ros2}:${IMAGE_TAG:-dev}
    network_mode: host
    ipc: host
    environment:
      <<: *common-env
      BAGS_DIR: /bags
      MIN_FREE_GB: ${MIN_FREE_GB:-20}
      MAX_BAG_SIZE_GB: ${MAX_BAG_SIZE_GB:-20}
      START_SYNC_MONITOR: ${START_SYNC_MONITOR:-1}
    volumes:
      - ${SMARTCAR_BAGS_HOST_DIR:-/home/yunle/bags}:/bags
    command: /usr/local/bin/record.sh
    profiles: [record]
    restart: "no"
    logging: *default-logging

  vehicle:
    image: ${IMAGE:-smartcar-ros2}:${IMAGE_TAG:-dev}
    network_mode: host
    ipc: host
    environment: *common-env
    devices:
      - ${VX1000_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    group_add:
      - dialout
    volumes:
      - ${SMARTCAR_CONFIG_HOST_DIR:-../config}:/config:ro
    command: ros2 launch smartcar_bringup vehicle.launch.py
    restart: unless-stopped
    profiles: [combined]
    logging: *default-logging
